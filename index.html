<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main / Only Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
<style>
    footer {
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 40px 0 24px 0;
            margin-top: auto;
        }

    .navbar {
            padding: 0.8rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            font-weight: 700;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 1.1rem;
        }

        #logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-left: 10px;
            object-fit: cover;
        }    

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            margin: 0 10px;
        }

        .nav-link.active-page {
            color: var(--brand-primary) !important;
            font-weight: 700;
        }

        body {
            font-family: cursive;
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:url(https://i.pinimg.com/736x/61/60/ec/6160ec239ebd2be3136e3b6423c84c56.jpg);
            background-size: cover;
            background-position: center;
        }

        .register-container {
            background-color: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .btn-black {
            background-color: #000;
            color: white;
            width: 100%;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: 0.2s;
        }

         .pfp-wrapper { display: flex; justify-content: center; margin-bottom: 20px; }

</style>

</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#">
                The Bradarian Collective Club
                <img src="https://i.pinimg.com/736x/61/60/ec/6160ec239ebd2be3136e3b6423c84c56.jpg" id="logo" alt="Logo">
            </a>
            <div class="collapse navbar-collapse justify-content-end show">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link.active-page" href="index.html">Home Page</a></li>
                    <li class="nav-item"><a class="nav-link" href="its not real">Club Events and Schedules</a></li>
                     <li class="nav-item"><a class="nav-link" href="members page.html">Club Leaders and Members</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
    <div class="register-container">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Bradarian Collective Club Login Page</h2>
            <p class="text-muted">Check your club status and events</p>
        </div>
        
        <div class="pfp-wrapper">
            <img src="https://i.pinimg.com/736x/61/60/ec/6160ec239ebd2be3136e3b6423c84c56.jpg" alt="Logo" class="img-fluid rounded-circle" width="60">
        </div>

    <form id="loginForm">
            <div class="mb-4">
                <label class="form-label fw-semibold">First Name</label>
                <input type="text" class="form-control" id="fname" placeholder="First Name" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Last Name</label>
                <input type="text" class="form-control" placeholder="Last Name" required id="lname">
            </div>

            <button class="btn btn-black" id="checkButton" py-click="club_verification_checker">Login</button>

        <p id="result"></p>

    </form>    


    <footer>
        <div class="container">
            <div class="row justify-content-center text-center">
                <div class="col-md-6">
                    <h6 class="fw-bold mb-2"></h6>
                    <p class="text-muted small mb-3">
                        For more information contact<br>
                        Club Moderator: My Name
                    </p>
                </div>
            </div>
            <hr class="my-3">
            <p class="text-center text-muted small mb-0">© 2026 Bradarian Collective</p>
        </div>
    </footer>

    <script type="py" src="main.py"></script>


</body>
</html>
